<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Mattiverse">
  <defs>
    <linearGradient id="mv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="mv-planet" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </radialGradient>
    <clipPath id="mv-front"><rect x="0" y="66" width="128" height="40"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#mv-bg)"/>
  <!-- stars -->
  <circle cx="24" cy="26" r="2.2" fill="#fff" fill-opacity=".85"/>
  <circle cx="102" cy="34" r="1.6" fill="#fff" fill-opacity=".7"/>
  <circle cx="96" cy="100" r="2" fill="#fff" fill-opacity=".8"/>
  <circle cx="30" cy="96" r="1.4" fill="#fff" fill-opacity=".6"/>
  <!-- orbit, behind the planet -->
  <g transform="rotate(-24 64 66)">
    <ellipse cx="64" cy="66" rx="48" ry="15" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5"/>
  </g>
  <circle cx="64" cy="64" r="26" fill="url(#mv-planet)"/>
  <!-- orbit, in front of the planet -->
  <g transform="rotate(-24 64 66)">
    <ellipse cx="64" cy="66" rx="48" ry="15" fill="none" stroke="#fff" stroke-width="5" clip-path="url(#mv-front)"/>
    <circle cx="112" cy="66" r="6" fill="#fff"/>
  </g>
</svg>
