# MatCMS – block-based CMS.
x-mattiverse:
  id: matcms
  name: MatCMS
  tagline: Block-based CMS for websites
  description: Build and publish websites from blocks, with plugins, multi-site support and built-in backups.
  category: Websites
  role: app
  icon: matcms.svg
  homepage: https://github.com/Real-TTX/MatCMS
  # Sends mail (form submissions, notifications): through MatSMTP when it is installed; Mattiverse fills MATSMTP_*.
  mail: {}
  ui:
    service: matcms
    port: 8080
    hostPort: 9101
  credentials:
    - label: Username
      value: admin
    - label: Password
      value: admin
    - label: Note
      value: Change this password after the first sign-in.

services:
  matcms:
    image: ghcr.io/real-ttx/matcms:latest
    restart: unless-stopped
    environment:
      MATSMTP_HOST: ${MATSMTP_HOST:-}
      MATSMTP_PORT: ${MATSMTP_PORT:-}
      MATSMTP_USERNAME: ${MATSMTP_USERNAME:-}
      MATSMTP_PASSWORD: ${MATSMTP_PASSWORD:-}
      MATSMTP_FROM: ${MATSMTP_FROM:-}
      MATSMTP_TLS: ${MATSMTP_TLS:-}
    volumes:
      # Database, keys, uploads and backups: everything lives here.
      - matcms-data:/app/appdata

volumes:
  matcms-data:
