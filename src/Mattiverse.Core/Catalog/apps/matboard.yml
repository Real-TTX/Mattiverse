# MatBoard – the digital whiteboard for teams.
x-mattiverse:
  id: matboard
  name: MatBoard
  tagline: The digital whiteboard for teams
  description: An endless board like Miro - sticky notes, shapes, connectors, frames, templates for workshops, comments, voting stamps and presenting, live with everybody at once, shared with people or by a link.
  category: Productivity
  role: app
  icon: matboard.svg
  homepage: https://github.com/Real-TTX/MatBoard
  # The platform contract (/api): Mattiverse fills MAT_API_KEY.
  platform: true
  # What the app uses of the engines (MatDesign docs/PLATFORM.md "Capabilities"): Mattiverse binds each when its engine is installed and passes the variables
  # of the binding to the web service by itself. A MatBoard on MatPlatform 2.2 says the same in its /api.
  consumes:
    - capability: identity.oidc   # the sign-in through MatIdentity (MATIDENTITY_*)
    - capability: mail.smtp       # its mail (shared boards) through MatSMTP (MATSMTP_*)
  ui:
    service: web
    port: 3945
    hostPort: 3945
  variables:
    - key: DB_PASSWORD
      label: Database password
      type: secret
      generate: true
      hidden: true
    - key: TIMEZONE
      label: Time zone
      default: Europe/Berlin
      advanced: true
  notes:
    - The PostgreSQL database is only reachable inside the stack; back up the volume matboard-db together with matboard-data.
  credentials:
    - label: First sign-in
      value: The first account that registers (or the first person through MatIdentity) is the administrator.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matboard
      POSTGRES_USER: matboard
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - matboard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matboard -d matboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/real-ttx/matboard:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=matboard;Username=matboard;Password=${DB_PASSWORD}"
      TZ: ${TIMEZONE:-Europe/Berlin}
      MAT_API_KEY: ${MAT_API_KEY}
    volumes:
      - matboard-data:/data

volumes:
  matboard-db:
  matboard-data:
