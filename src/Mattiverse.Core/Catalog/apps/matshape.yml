# MatShape – 3D CAD in the browser.
x-mattiverse:
  id: matshape
  name: MatShape
  tagline: 3D CAD in the browser
  description: Parametric parts from constraint sketches and features (fillet, chamfer, hole, shell, sweep, loft ...), drawings and assemblies, STEP export, versions, sharing and an AI assistant.
  category: Productivity
  role: app
  icon: matshape.svg
  homepage: https://github.com/Real-TTX/MatShape
  # The platform contract (/api): Mattiverse fills MAT_API_KEY.
  platform: true
  # What the app uses of the engines (MatDesign docs/PLATFORM.md "Capabilities"): Mattiverse binds each when its engine is installed and passes the variables
  # of the binding to the web service by itself. A MatShape on MatPlatform 2.2 says the same in its /api.
  consumes:
    - capability: identity.oidc   # the sign-in through MatIdentity (MATIDENTITY_*)
    - capability: mail.smtp       # its mail (shared documents) through MatSMTP (MATSMTP_*)
  ui:
    service: web
    port: 3939
    hostPort: 3939
  variables:
    - key: DB_PASSWORD
      label: Database password
      type: secret
      generate: true
      hidden: true
    - key: TIMEZONE
      label: Time zone
      default: Europe/Berlin
      advanced: true
  notes:
    - The PostgreSQL database is only reachable inside the stack; back up the volume matshape-db together with matshape-data.
    - The geometry is computed in the browser; the server keeps the history of the features.
  credentials:
    - label: First sign-in
      value: The first account that registers (or the first person through MatIdentity) is the administrator.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matshape
      POSTGRES_USER: matshape
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - matshape-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matshape -d matshape"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/real-ttx/matshape:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=matshape;Username=matshape;Password=${DB_PASSWORD}"
      TZ: ${TIMEZONE:-Europe/Berlin}
      MAT_API_KEY: ${MAT_API_KEY}
    volumes:
      - matshape-data:/data

volumes:
  matshape-db:
  matshape-data:
