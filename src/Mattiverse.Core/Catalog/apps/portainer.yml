# Portainer CE – an alternative Docker management UI.
x-mattiverse:
  id: portainer
  name: Portainer
  tagline: Docker management UI
  description: Containers, images, volumes and networks of this host in a web UI.
  category: Infrastructure
  role: docker
  homepage: https://www.portainer.io
  ui:
    service: portainer
    port: 9000
    hostPort: 9000
  notes:
    - Portainer locks itself 5 minutes after the start if no administrator has been created. Open it right after the install.
  credentials:
    - label: First sign-in
      value: Portainer asks you to create the administrator account.

services:
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  portainer-data:
