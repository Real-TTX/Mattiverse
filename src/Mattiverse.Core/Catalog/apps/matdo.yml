# MatDo – tasks, projects and teams.
x-mattiverse:
  id: matdo
  name: MatDo
  tagline: Tasks, projects and teams
  description: Tasks like Todoist - a quick add in German and English, projects with sections and sub-tasks, teams, notifications and a webhook for dictation.
  category: Productivity
  role: app
  icon: matdo.svg
  homepage: https://github.com/Real-TTX/MatDo
  # The platform contract (/api) and the sign-in through MatIdentity: Mattiverse fills MAT_API_KEY and MATIDENTITY_*.
  # MatDo sends no mail (reminders are Web Push), so there is no mail: {}.
  platform: true
  identity: {}
  ui:
    service: web
    port: 6006
    hostPort: 6006
  variables:
    - key: DB_PASSWORD
      label: Database password
      type: secret
      generate: true
      hidden: true
    - key: TIMEZONE
      label: Time zone
      default: Europe/Berlin
      advanced: true
  notes:
    - The PostgreSQL database is only reachable inside the stack.
  credentials:
    - label: First sign-in
      value: The first account that registers (or the first person through MatIdentity) is the administrator.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matdo
      POSTGRES_USER: matdo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      # New volumes for the rewritten app: its migrations do not run on the database of the old Matdo.
      - matdo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matdo -d matdo"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/real-ttx/matdo:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=matdo;Username=matdo;Password=${DB_PASSWORD}"
      TZ: ${TIMEZONE:-Europe/Berlin}
      MAT_API_KEY: ${MAT_API_KEY}
      MATIDENTITY_AUTHORITY: ${MATIDENTITY_AUTHORITY:-}
      MATIDENTITY_INTERNAL_URL: ${MATIDENTITY_INTERNAL_URL:-}
      MATIDENTITY_CLIENT_ID: ${MATIDENTITY_CLIENT_ID:-}
      MATIDENTITY_CLIENT_SECRET: ${MATIDENTITY_CLIENT_SECRET:-}
    volumes:
      - matdo-data:/data

volumes:
  matdo-db:
  matdo-data:
