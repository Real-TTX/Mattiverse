# Matmon – monitoring.
x-mattiverse:
  id: matmon
  name: Matmon
  tagline: Monitoring for your services
  description: Sensors, status pages and alerts for the services in your network, with remote probes for other sites.
  category: Monitoring
  role: app
  icon: matmon.svg
  homepage: https://github.com/Real-TTX/Matmon
  # Sends mail (alerts, summary reports): through MatSMTP when it is installed; Mattiverse fills MATSMTP_*.
  mail: {}
  ui:
    service: matmon
    port: 8099
    hostPort: 8099
  variables:
    - key: ADMIN_EMAIL
      label: Admin e-mail
      default: admin@mattiverse.local
      help: Matmon signs in with an e-mail address.
    - key: ADMIN_PASSWORD
      label: Admin password
      type: secret
      generate: true
      help: Leave empty to generate one.
    - key: TIMEZONE
      label: Time zone
      default: Europe/Berlin
      advanced: true
  credentials:
    - label: E-mail
      value: ${ADMIN_EMAIL}
    - label: Password
      value: ${ADMIN_PASSWORD}
      secret: true

services:
  matmon:
    image: ghcr.io/real-ttx/matmon:latest
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
      Matmon__Auth__Username: ${ADMIN_EMAIL}
      Matmon__Auth__Password: ${ADMIN_PASSWORD}
      MATSMTP_HOST: ${MATSMTP_HOST:-}
      MATSMTP_PORT: ${MATSMTP_PORT:-}
      MATSMTP_USERNAME: ${MATSMTP_USERNAME:-}
      MATSMTP_PASSWORD: ${MATSMTP_PASSWORD:-}
      MATSMTP_FROM: ${MATSMTP_FROM:-}
      MATSMTP_TLS: ${MATSMTP_TLS:-}
    volumes:
      - matmon-data:/app/data
    extra_hosts:
      # Lets sensors reach services on the Docker host through host.docker.internal.
      - "host.docker.internal:host-gateway"

volumes:
  matmon-data:
