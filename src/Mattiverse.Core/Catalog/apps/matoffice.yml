# MatOffice – office in the browser: Docs, Sheets, Slides and Base in one app.
x-mattiverse:
  id: matoffice
  name: MatOffice
  tagline: Office in the browser – documents, spreadsheets, presentations, databases
  description: Four apps in one, like the office suites you know – with Word, Excel and PowerPoint files, sharing, versions and offline use. MatDrive opens its office files in it.
  category: Productivity
  role: app
  icon: matoffice.svg
  homepage: https://github.com/Real-TTX/MatOffice
  # The platform contract (/api) and the sign-in through MatIdentity: Mattiverse fills MAT_API_KEY and MATIDENTITY_*.
  platform: true
  identity: {}
  # Sends mail when a document is shared: through MatSMTP when it is installed; Mattiverse fills MATSMTP_*.
  mail: {}
  ui:
    service: web
    port: 4820
    hostPort: 4820
  variables:
    - key: DB_PASSWORD
      label: Database password
      type: secret
      generate: true
      hidden: true
    - key: TIMEZONE
      label: Time zone
      default: Europe/Berlin
      advanced: true
  notes:
    - To edit the office files of MatDrive, make a key under Administration → Connected apps and enter it in MatDrive (Administration → Integrations).
  credentials:
    - label: First sign-in
      value: The first account that registers is the administrator.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matoffice
      POSTGRES_USER: matoffice
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - matoffice-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matoffice -d matoffice"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/real-ttx/matoffice:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=matoffice;Username=matoffice;Password=${DB_PASSWORD}"
      TZ: ${TIMEZONE:-Europe/Berlin}
      MAT_API_KEY: ${MAT_API_KEY}
      MATIDENTITY_AUTHORITY: ${MATIDENTITY_AUTHORITY:-}
      MATIDENTITY_INTERNAL_URL: ${MATIDENTITY_INTERNAL_URL:-}
      MATIDENTITY_CLIENT_ID: ${MATIDENTITY_CLIENT_ID:-}
      MATIDENTITY_CLIENT_SECRET: ${MATIDENTITY_CLIENT_SECRET:-}
      MATSMTP_HOST: ${MATSMTP_HOST:-}
      MATSMTP_PORT: ${MATSMTP_PORT:-}
      MATSMTP_USERNAME: ${MATSMTP_USERNAME:-}
      MATSMTP_PASSWORD: ${MATSMTP_PASSWORD:-}
      MATSMTP_FROM: ${MATSMTP_FROM:-}
      MATSMTP_TLS: ${MATSMTP_TLS:-}
    volumes:
      - matoffice-data:/data

volumes:
  matoffice-db:
  matoffice-data:
