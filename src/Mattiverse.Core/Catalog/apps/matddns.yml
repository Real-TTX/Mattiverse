# Matddns – universal DynDNS updater.
x-mattiverse:
  id: matddns
  name: Matddns
  tagline: DynDNS client with failover
  description: >-
    Keeps your DNS records in sync with your current IP. Pulls the IP from many sources (public IP, UniFi, FRITZ!Box, ...),
    writes it to Cloudflare, Netcup, Hetzner, GoDaddy or any DynDNS provider and fails over to the next reachable source.
  category: Infrastructure
  role: ddns
  icon: matddns.svg
  homepage: https://github.com/Real-TTX/Matddns
  recommended: true
  provision: matddns
  core: true
  # The platform contract (/api) and the sign-in through MatIdentity: Mattiverse fills MAT_API_KEY, MAT_FRAME_ANCESTORS and MATIDENTITY_*.
  platform: true
  # What the app uses of the engines (MatDesign docs/PLATFORM.md "Capabilities"): Mattiverse binds each when its engine is installed.
  consumes:
    - capability: identity.oidc   # the sign-in through MatIdentity (MATIDENTITY_*)
    - capability: mail.smtp       # its mail through MatSMTP (MATSMTP_*)
  ui:
    service: matddns
    port: 8080
    hostPort: 4060
  variables:
    - key: MATDDNS_API_KEY
      label: API key
      type: secret
      generate: true
      hidden: true
    - key: ADMIN_PASSWORD
      label: Admin password
      type: secret
      generate: true
      help: The password of the user "admin". Leave empty to generate one.
    - key: TIMEZONE
      label: Time zone
      default: Europe/Berlin
      advanced: true
  credentials:
    - label: Username
      value: admin
    - label: Password
      value: ${ADMIN_PASSWORD}
      secret: true
    - label: Note
      value: Mattiverse adds the source, the DNS records of your apps and the rules itself. They carry a "Managed by Mattiverse" badge.

services:
  matddns:
    image: ghcr.io/real-ttx/matddns:latest
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
      MATDDNS_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MATDDNS_API_KEY: ${MATDDNS_API_KEY}
      MATDDNS_FORWARDED_HEADERS: "true"
      MAT_API_KEY: ${MAT_API_KEY}
      # The addresses of Mattiverse, which may show it in the window of its home screen (MatDesign docs/PLATFORM.md); empty: nobody may frame it.
      MAT_FRAME_ANCESTORS: ${MAT_FRAME_ANCESTORS:-}
      MATIDENTITY_AUTHORITY: ${MATIDENTITY_AUTHORITY:-}
      MATIDENTITY_INTERNAL_URL: ${MATIDENTITY_INTERNAL_URL:-}
      MATIDENTITY_CLIENT_ID: ${MATIDENTITY_CLIENT_ID:-}
      MATIDENTITY_CLIENT_SECRET: ${MATIDENTITY_CLIENT_SECRET:-}
      MATSMTP_HOST: ${MATSMTP_HOST:-}
      MATSMTP_PORT: ${MATSMTP_PORT:-}
      MATSMTP_USERNAME: ${MATSMTP_USERNAME:-}
      MATSMTP_PASSWORD: ${MATSMTP_PASSWORD:-}
      MATSMTP_FROM: ${MATSMTP_FROM:-}
      MATSMTP_TLS: ${MATSMTP_TLS:-}
    volumes:
      - matddns-data:/data
    # Lets the non-root user send ICMP for the "ping" failover check.
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  matddns-data:
