# Nginx Proxy Manager – an alternative reverse proxy.
x-mattiverse:
  id: nginx-proxy-manager
  name: Nginx Proxy Manager
  tagline: Reverse proxy with a friendly UI
  description: >-
    Proxy hosts, redirects and free Let's Encrypt certificates, managed in a web UI.
    Mattiverse cannot create the routes for you; add a proxy host that forwards to the container name shown on the app page.
  category: Infrastructure
  role: proxy
  homepage: https://nginxproxymanager.com
  ui:
    service: app
    port: 81
    hostPort: 81
  shared: [app]
  notes:
    - Needs the host ports 80 and 443. Stop any other web server or proxy that uses them first.
  credentials:
    - label: Email
      value: admin@example.com
    - label: Password
      value: changeme
    - label: Note
      value: Nginx Proxy Manager asks you to change these on the first sign-in.

services:
  app:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt

volumes:
  data:
  letsencrypt:
