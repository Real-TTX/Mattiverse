# MatDock – Docker manager for servers (the advanced Docker management).
x-mattiverse:
  id: matdock
  name: MatDock
  tagline: Advanced Docker management
  description: >-
    Stacks, containers, volumes, live logs, a web terminal and scheduled backups across many hosts over SSH.
    Use it where Mattiverse stops: managing other servers, migrating volumes and backups to a NAS.
  category: Infrastructure
  role: docker
  icon: matdock.svg
  homepage: https://github.com/Real-TTX/MatDock
  recommended: true
  provision: matdock
  core: true
  ui:
    service: matdock
    port: 4455
    hostPort: 4455
  variables:
    - key: MATDOCK_API_KEY
      label: API key
      type: secret
      generate: true
      hidden: true
    - key: ADMIN_PASSWORD
      label: Admin password
      type: secret
      generate: true
      help: The initial password of the user "admin" (MatDock asks to change it on the first sign-in). Leave empty to generate one.
  notes:
    - Mattiverse deploys, updates and backs up its apps as stacks in MatDock. You see them there with a "Managed by Mattiverse" badge and can change them.
  credentials:
    - label: Username
      value: admin
    - label: Password
      value: ${ADMIN_PASSWORD}
      secret: true
    - label: Note
      value: The local Docker engine is added automatically under Environments.

services:
  matdock:
    # MatDock publishes :release (and version tags) but no :latest.
    image: ghcr.io/real-ttx/matdock:release
    restart: unless-stopped
    environment:
      MatDock__DataPath: /data
      MatDock__Admin__Seed: "true"
      MatDock__Admin__Username: admin
      MatDock__Admin__Password: ${ADMIN_PASSWORD}
      MatDock__Api__Key: ${MATDOCK_API_KEY}
      MatDock__Environments__EnsureLocal: "true"
    volumes:
      - matdock-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  matdock-data:
